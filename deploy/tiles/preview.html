<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Map preview</title>
  <!-- Opens the map from this service's own style.json, tiles, glyphs and sprites, and
       tries the API on it: search (autocomplete + geocode), address of a clicked point and routing.
       The Style picker lists GET /v1/styles; ?style=<id> opens one style, and "Make default"
       calls PUT /v1/styles/default (needs a key from ADMIN_API_KEYS in the key field).
       MapLibre GL JS is vendored (deploy/tiles/vendor): no third-party hosts are contacted.
       Served at /tiles/preview.html. /v1/* needs an API key: add ?key=<API key> or type it into
       the panel (kept in sessionStorage). The key is sent to this service only.
       Trips (/v1/trips, through Caddy): with A and B set, "Start a trip" creates one and the page
       plays the driver - it drives the route with simulated GPS, sends batches of positions and
       follows the new route when the service builds one ("Detour" drives somewhere else first).
       The watcher's link, #trip=<id>&watch=<token>, opens this page as the watcher: it follows
       the event stream (fetch with Authorization; the token stays in the fragment, which never
       reaches a server, and is removed from the address bar). -->
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <style>
    html, body { height: 100%; margin: 0; font: 14px/1.4 system-ui, sans-serif; color: #202124; }
    [hidden] { display: none !important; } /* display rules below would override the attribute */
    #map { position: absolute; inset: 0; }
    body.route-mode .maplibregl-canvas-container.maplibregl-interactive { cursor: crosshair; }

    #panel { position: absolute; z-index: 2; top: 10px; left: 10px; box-sizing: border-box;
             width: min(360px, calc(100vw - 20px)); max-height: calc(100% - 20px); overflow: auto;
             display: flex; flex-direction: column; gap: 8px; padding: 10px;
             background: rgba(255,255,255,.95); border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
    #panel .row { display: flex; gap: 6px; align-items: center; }
    #panel input[type=search], #panel input[type=password] { flex: 1; min-width: 0; box-sizing: border-box;
             padding: 6px 8px; border: 1px solid #c4c7c5; border-radius: 6px; font: inherit; }
    #panel input:focus-visible, #panel button:focus-visible, #panel select:focus-visible, #results li:focus-visible
             { outline: 2px solid #1a73e8; outline-offset: 1px; }
    #panel button { padding: 5px 10px; border: 1px solid #c4c7c5; border-radius: 6px; background: #fff; font: inherit; cursor: pointer; }
    #panel button:hover { background: #f1f3f4; }
    #panel button[aria-pressed=true] { background: #1a73e8; border-color: #1a73e8; color: #fff; }
    #panel select { font: inherit; }
    .muted { color: #5f6368; font-size: 12px; }
    #hint { margin: 0; }
    #status { color: #555; font-size: 12px; }
    #status.error, .err { color: #b00020; }
    #key.missing { border-color: #b00020; }
    #style { flex: 1; min-width: 0; }
    #styleDesc { margin: -4px 0 0; }

    #results { list-style: none; margin: 0; padding: 0; max-height: 40vh; overflow: auto; border: 1px solid #e0e0e0; border-radius: 6px; }
    #results li { padding: 6px 8px; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
    #results li:last-child { border-bottom: 0; }
    #results li:hover, #results li[aria-selected=true] { background: #e8f0fe; }
    #results li.empty { cursor: default; color: #5f6368; }
    #results li.empty:hover { background: none; }
    .r-name { font-weight: 600; }

    #route { display: flex; flex-direction: column; gap: 6px; }
    #route ol { list-style: none; margin: 0; padding: 0; }
    #wps li { display: flex; gap: 6px; align-items: center; padding: 2px 0; }
    #wps .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #wps button { padding: 0 6px; line-height: 20px; }
    .alt { display: block; width: 100%; text-align: left; margin-bottom: 4px; }
    #panel button.alt[aria-pressed=true] { background: #e8f0fe; border-color: #1a73e8; color: inherit; }
    #steps { max-height: 30vh; overflow: auto; border-top: 1px solid #eee; }
    #steps li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; cursor: pointer; }
    #steps li:hover { background: #f5f5f5; }

    .wp { box-sizing: border-box; width: 26px; height: 26px; border-radius: 50%; background: #5f6368; color: #fff;
          font: 600 13px/22px system-ui, sans-serif; text-align: center; border: 2px solid #fff;
          box-shadow: 0 1px 4px rgba(0,0,0,.4); }
    .wp.start { background: #188038; }
    .wp.end { background: #d93025; }
    .wp.via { background: #1a73e8; }
    .marker.wp { cursor: grab; }
    #wps .wp { flex: none; cursor: default; }

    @media (max-width: 720px) {
      /* leave room for the zoom buttons and keep part of the map visible */
      #panel { width: calc(100vw - 70px); max-height: 55%; }
      #steps { max-height: 18vh; }
    }

    /* trips */
    #trip { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #eee; padding-top: 8px; }
    #tripHead { font-weight: 600; }
    #tripInfo { font-size: 13px; }
    #tripInfo .eta { font-size: 16px; font-weight: 600; }
    #tripInfo .off { color: #b06000; font-weight: 600; }
    #watchLink { word-break: break-all; }
    body.watch-mode .plan { display: none !important; }
    body.detour-pick .maplibregl-canvas-container.maplibregl-interactive { cursor: crosshair; }
    .car { box-sizing: border-box; width: 22px; height: 22px; border-radius: 50%; background: #1a73e8;
           border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
    .car::after { content: ''; position: absolute; left: 50%; top: -11px; margin-left: -5px;
                  border: 5px solid transparent; border-bottom: 8px solid #1a73e8; }
    .car.watched { background: #0b8043; }
    .car.watched::after { border-bottom-color: #0b8043; }

    .pop { min-width: 180px; padding-right: 8px; }
    .pop-name { font-weight: 600; }
    .pop-actions { display: flex; gap: 6px; margin-top: 6px; }
    .pop-actions button { padding: 3px 8px; border: 1px solid #c4c7c5; border-radius: 6px; background: #fff; font: inherit; cursor: pointer; }
    .pop-actions button:hover { background: #f1f3f4; }
  </style>
</head>
<body>
  <div id="panel">
    <div class="row plan">
      <input id="q" type="search" placeholder="Search address or place" aria-label="Search address or place"
             autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="results">
    </div>
    <ul id="results" class="plan" role="listbox" hidden></ul>

    <div class="row plan">
      <button id="routeBtn" type="button" aria-pressed="false">Route</button>
      <select id="profile" aria-label="Routing profile" title="Routing profile">
        <option>car</option>
        <option>foot</option>
      </select>
      <button id="clearBtn" type="button" title="Remove the route, markers and search results">Clear</button>
    </div>
    <p id="hint" class="muted plan"></p>

    <div id="route" class="plan" hidden>
      <ol id="wps"></ol>
      <div id="alts"></div>
      <button id="tripStartBtn" type="button" disabled
              title="POST /v1/trips from A to B (car), then drive it with simulated GPS">Start a trip A → B</button>
      <ol id="steps"></ol>
    </div>

    <div id="trip" hidden>
      <div class="row"><span id="tripHead">Trip</span><span id="tripConn" class="muted"></span></div>
      <div id="tripInfo"></div>
      <div class="row driver-only">
        <button id="driveBtn" type="button" aria-pressed="false">Drive</button>
        <label class="muted">speed <select id="simMult" aria-label="Simulation speed">
          <option value="1">1×</option><option value="2">2×</option><option value="5" selected>5×</option><option value="10">10×</option>
        </select></label>
        <label class="muted"><input id="simNoise" type="checkbox" checked> GPS noise</label>
      </div>
      <div class="row driver-only">
        <button id="detourBtn" type="button" aria-pressed="false" title="Click the map: the car drives there instead of following the route">Detour</button>
        <button id="finishBtn" type="button">Finish</button>
        <button id="cancelBtn" type="button">Cancel</button>
      </div>
      <div class="driver-only muted">Watcher's link (the token is in the #fragment):
        <a id="watchLink" target="_blank" rel="noopener"></a></div>
      <div class="row watcher-only" hidden><button id="unwatchBtn" type="button">Stop watching</button></div>
    </div>

    <div class="row">
      <label class="muted" for="style">Style</label>
      <select id="style" aria-label="Map style"><option value="">default</option></select>
      <button id="defaultBtn" type="button" title="Serve this style at /tiles/style.json to every client (admin key)">Make default</button>
    </div>
    <p id="styleDesc" class="muted"></p>

    <div class="row">
      <label class="muted">Language <select id="lang"></select></label>
      <input id="key" type="password" placeholder="API key" aria-label="API key" autocomplete="off">
    </div>
    <span id="status">loading style…</span>
  </div>
  <div id="map"></div>

  <script src="vendor/maplibre-gl.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const store = {
      get(k) { try { return sessionStorage.getItem(k) || ''; } catch { return ''; } },
      set(k, v) { try { sessionStorage.setItem(k, v); } catch { /* storage may be blocked */ } },
      del(k) { try { sessionStorage.removeItem(k); } catch { /* storage may be blocked */ } },
    };
    // A watcher's link: #trip=<id>&watch=<token>. Taken out of the address bar at once (the
    // map keeps its position in the hash) and kept for this tab only.
    let watchTarget = null;
    {
      const frag = new URLSearchParams(location.hash.slice(1));
      if (frag.get('trip') && frag.get('watch')) {
        watchTarget = { id: frag.get('trip'), token: frag.get('watch') };
        store.set('watch', JSON.stringify(watchTarget));
        history.replaceState(null, '', location.pathname + location.search);
      } else {
        try { watchTarget = JSON.parse(store.get('watch') || 'null'); } catch { watchTarget = null; }
      }
    }
    let apiKey = params.get('key') || store.get('apiKey');

    const $ = (id) => document.getElementById(id);
    const statusEl = $('status'), langEl = $('lang'), qEl = $('q'), resultsEl = $('results'), keyEl = $('key');
    const routeBtn = $('routeBtn'), profileEl = $('profile'), hintEl = $('hint');
    const routeEl = $('route'), wpsEl = $('wps'), altsEl = $('alts'), stepsEl = $('steps');
    const styleEl = $('style'), defaultBtn = $('defaultBtn'), styleDescEl = $('styleDesc');
    if (params.get('style')) styleEl.add(new Option(params.get('style'), params.get('style'), true, true));
    keyEl.value = apiKey;

    // DOM builder: text always goes in as text nodes, never as HTML (names come from OSM data).
    function h(tag, attrs, ...kids) {
      const e = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
      }
      for (const c of kids.flat()) if (c != null && c !== false) e.append(c);
      return e;
    }
    function setStatus(text, isError) {
      statusEl.textContent = text;
      statusEl.className = isError ? 'error' : '';
    }

    // ?style=<id> opens that style; without it the default one (style.json).
    const styleURL = (id) => new URL(id ? 'styles/' + encodeURIComponent(id) + '.json' : 'style.json', location.href).href;
    const map = new maplibregl.Map({
      container: 'map',
      style: styleURL(params.get('style')),
      hash: true,
      attributionControl: { compact: true },
      // Send the API key to this service only, never to other hosts.
      transformRequest: (url) =>
        apiKey && url.startsWith(location.origin) ? { url, headers: { 'X-API-Key': apiKey } } : undefined,
    });
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
    map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }));

    // ------------------------------------------------------------------ API
    const inflight = {};
    // Calls GET /v1/<path> (or another method with a JSON body). A newer call with the
    // same `slot` aborts the previous one.
    async function api(path, query, slot, method = 'GET', payload) {
      inflight[slot]?.abort();
      const ctl = inflight[slot] = new AbortController();
      const url = new URL('../v1/' + path, location.href);
      for (const [k, v] of Object.entries(query)) if (v !== undefined && v !== '') url.searchParams.set(k, v);
      const headers = apiKey ? { 'X-API-Key': apiKey } : {};
      if (payload !== undefined) headers['Content-Type'] = 'application/json';
      const res = await fetch(url, { method, headers, body: payload === undefined ? undefined : JSON.stringify(payload), signal: ctl.signal });
      const body = await res.json().catch(() => null);
      if (!res.ok) {
        const err = new Error((body && body.error && body.error.message) || res.statusText);
        err.status = res.status;
        throw err;
      }
      return body;
    }
    function showError(e) {
      if (e.name === 'AbortError') return;
      if (e.status === 401) {
        keyEl.classList.add('missing');
        keyEl.focus();
        setStatus('API key required: enter it in the field below', true);
      } else {
        setStatus(e.message, true);
      }
    }
    keyEl.addEventListener('change', () => {
      apiKey = keyEl.value.trim();
      store.set('apiKey', apiKey);
      keyEl.classList.remove('missing');
      setStatus('ok');
      loadStyles();
    });
    const lang = () => langEl.value || undefined;

    const fmtLL = (ll) => ll[1].toFixed(5) + ', ' + ll[0].toFixed(5);
    const addrLine = (a) => [[a.street, a.house_number].filter(Boolean).join(' '), a.district, a.city].filter(Boolean).join(', ');
    const placeName = (p) => p.name || addrLine(p.address) || 'Unnamed place';
    const fmtDist = (m) => m >= 1000 ? (m / 1000).toFixed(m >= 10000 ? 0 : 1) + ' km' : Math.round(m) + ' m';
    function fmtDur(s) {
      const m = Math.round(s / 60);
      if (m < 1) return '<1 min';
      return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min';
    }

    // --------------------------------------------------- picked point + popup
    let pick = null;
    function showPick(ll, node) {
      if (!pick) {
        pick = { marker: new maplibregl.Marker({ color: '#d93025' }), popup: new maplibregl.Popup({ maxWidth: '300px', closeOnClick: false }) };
        pick.marker.setPopup(pick.popup);
      }
      pick.marker.setLngLat(ll).addTo(map);
      pick.popup.setDOMContent(node);
      if (!pick.popup.isOpen()) pick.marker.togglePopup();
    }
    function clearPick() {
      if (pick) { pick.popup.remove(); pick.marker.remove(); }
    }
    function placeNode(p, ll) {
      const name = p ? placeName(p) : 'No address here';
      return h('div', { class: 'pop' },
        h('div', { class: 'pop-name' }, name),
        p && addrLine(p.address) && addrLine(p.address) !== name ? h('div', {}, addrLine(p.address)) : null,
        p ? h('div', { class: 'muted' }, [p.type, p.source, p.id].filter(Boolean).join(' · ')) : null,
        h('div', { class: 'muted' }, fmtLL(ll)),
        h('div', { class: 'pop-actions' },
          h('button', { type: 'button', onclick: () => setWaypoint('start', ll, p && name) }, 'Route from here'),
          h('button', { type: 'button', onclick: () => setWaypoint('end', ll, p && name) }, 'Route to here')));
    }

    // Address of a clicked point: GET /v1/reverse.
    async function lookupPoint(lngLat) {
      const ll = [lngLat.lng, lngLat.lat];
      showPick(ll, h('div', { class: 'muted' }, 'Looking up…'));
      try {
        const p = await api('reverse', { lat: ll[1].toFixed(6), lon: ll[0].toFixed(6), lang: lang() }, 'reverse');
        showPick(ll, placeNode(p, ll));
        setStatus('ok');
      } catch (e) {
        if (e.name === 'AbortError') return;
        if (e.status === 404) { showPick(ll, placeNode(null, ll)); setStatus('ok'); return; }
        showPick(ll, h('div', { class: 'err' }, e.message));
        showError(e);
      }
    }

    // --------------------------------------------------------------- search
    let places = [], active = -1, acTimer;
    function hideResults() {
      resultsEl.hidden = true;
      resultsEl.replaceChildren();
      qEl.setAttribute('aria-expanded', 'false');
      places = []; active = -1;
    }
    function setActive(i) {
      const items = [...resultsEl.children];
      if (!places.length) return;
      active = (i + items.length) % items.length;
      items.forEach((li, j) => li.setAttribute('aria-selected', String(j === active)));
      items[active].scrollIntoView({ block: 'nearest' });
    }
    function showResults(list) {
      places = list;
      active = -1;
      resultsEl.replaceChildren(...(list.length
        ? list.map((p, i) => h('li', { role: 'option', 'aria-selected': 'false', onclick: () => selectPlace(places[i]) },
            h('div', { class: 'r-name' }, placeName(p)),
            h('div', { class: 'muted' }, [addrLine(p.address) !== placeName(p) ? addrLine(p.address) : '', p.type].filter(Boolean).join(' · '))))
        : [h('li', { class: 'empty' }, 'Nothing found')]));
      resultsEl.hidden = false;
      qEl.setAttribute('aria-expanded', 'true');
    }
    function selectPlace(p) {
      hideResults();
      qEl.value = placeName(p);
      const ll = [p.lon, p.lat];
      showPick(ll, placeNode(p, ll));
      map.flyTo({ center: ll, zoom: Math.max(map.getZoom(), 16) });
    }
    // kind: 'autocomplete' while typing (biased to the map centre), 'geocode' on Enter.
    async function runSearch(kind, q) {
      const c = map.getCenter();
      try {
        const data = await api(kind, {
          q, lang: lang(), limit: 8,
          lat: kind === 'autocomplete' ? c.lat.toFixed(5) : undefined,
          lon: kind === 'autocomplete' ? c.lng.toFixed(5) : undefined,
        }, 'search');
        showResults(data.places || []);
        setStatus('ok');
      } catch (e) { showError(e); }
    }
    qEl.addEventListener('input', () => {
      clearTimeout(acTimer);
      inflight.search?.abort();
      const q = qEl.value.trim();
      if (q.length < 2) { hideResults(); return; }
      acTimer = setTimeout(() => runSearch('autocomplete', q), 250);
    });
    qEl.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); setActive(active + 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active - 1); }
      else if (e.key === 'Escape') { hideResults(); }
      else if (e.key === 'Enter') {
        e.preventDefault();
        clearTimeout(acTimer);
        const q = qEl.value.trim();
        if (active >= 0) selectPlace(places[active]);
        else if (q) runSearch('geocode', q);
      }
    });

    // ---------------------------------------------------------------- route
    // Ordered points: start, via..., end. start and end may be set independently
    // ("Route to here" before "Route from here").
    const route = { start: null, end: null, via: [] };
    let routes = [], selected = 0, routeMode = false;
    const pts = () => [route.start, ...route.via, route.end].filter(Boolean);
    const roleOf = (wp) => wp === route.start ? 'start' : wp === route.end ? 'end' : 'via';
    const labelOf = (wp) => ({ start: 'A', end: 'B' })[roleOf(wp)] || String(route.via.indexOf(wp) + 1);

    function updateHint() {
      hintEl.textContent = routeMode
        ? 'Click the map to add start, end and via points; drag markers to move them.'
        : 'Click the map to see the address of a point.';
      routeEl.hidden = !(routeMode || pts().length);
    }
    function setRouteMode(on) {
      routeMode = on;
      document.body.classList.toggle('route-mode', on);
      routeBtn.setAttribute('aria-pressed', String(on));
      updateHint();
    }
    routeBtn.addEventListener('click', () => setRouteMode(!routeMode));

    function makeWp(ll, label) {
      const el = h('div', { class: 'wp marker', title: 'Drag to move' });
      const marker = new maplibregl.Marker({ element: el, draggable: true }).setLngLat(ll).addTo(map);
      const wp = { el, marker, ll, label };
      marker.on('dragend', () => {
        const p = marker.getLngLat();
        wp.ll = [p.lng, p.lat];
        wp.label = '';
        refreshRoute(false);
      });
      return wp;
    }
    function setWaypoint(role, ll, label) {
      clearPick();
      setRouteMode(true);
      route[role]?.marker.remove();
      route[role] = makeWp(ll, label);
      refreshRoute(true);
    }
    function addWaypoint(lngLat) {
      const ll = [lngLat.lng, lngLat.lat];
      if (!route.start) setWaypoint('start', ll);
      else if (!route.end) setWaypoint('end', ll);
      else { route.via.push(makeWp(ll)); refreshRoute(true); }
    }
    function removeWp(wp) {
      wp.marker.remove();
      if (route.start === wp) route.start = null;
      else if (route.end === wp) route.end = null;
      else route.via.splice(route.via.indexOf(wp), 1);
      refreshRoute(true);
    }
    function clearAll() {
      for (const wp of pts()) wp.marker.remove();
      route.start = route.end = null;
      route.via = [];
      inflight.route?.abort();
      clearPick();
      hideResults();
      qEl.value = '';
      renderRoutes([]);
      refreshRoute(false);
      setStatus('ok');
    }
    $('clearBtn').addEventListener('click', clearAll);
    profileEl.addEventListener('change', () => refreshRoute(false));

    function refreshRoute(fit) {
      const list = pts();
      for (const wp of list) {
        wp.el.className = 'wp marker ' + roleOf(wp);
        wp.el.textContent = labelOf(wp);
      }
      wpsEl.replaceChildren(...list.map((wp) => h('li', {},
        h('span', { class: 'wp ' + roleOf(wp) }, labelOf(wp)),
        h('span', { class: 'txt' }, wp.label || fmtLL(wp.ll)),
        h('button', { type: 'button', title: 'Remove this point', 'aria-label': 'Remove point ' + labelOf(wp), onclick: () => removeWp(wp) }, '×'))));
      updateHint();
      tripStartBtn.disabled = !(route.start && route.end);
      if (list.length < 2) { inflight.route?.abort(); renderRoutes([]); return; }
      loadRoute(list, fit);
    }

    // GET /v1/route with GeoJSON geometry, turn-by-turn steps and (for two points) alternatives.
    async function loadRoute(list, fit) {
      setStatus('routing…');
      try {
        const data = await api('route', {
          profile: profileEl.value,
          points: list.map((wp) => wp.ll[0].toFixed(6) + ',' + wp.ll[1].toFixed(6)).join(';'),
          geometry: 'geojson',
          steps: 'true',
          alternatives: list.length === 2 ? 'true' : undefined,
        }, 'route');
        renderRoutes(data.routes || []);
        if (fit) fitRoutes();
        setStatus('ok');
      } catch (e) {
        if (e.name === 'AbortError') return;
        renderRoutes([], e.message);
        showError(e);
      }
    }
    function selectRoute(i) {
      selected = i;
      renderRoutes(routes, '', true);
    }
    function renderRoutes(list, errMsg, keepSelection) {
      routes = list;
      if (!keepSelection) selected = 0;
      const src = map.getSource && map.getSource('routes');
      if (src) {
        src.setData({
          type: 'FeatureCollection',
          features: routes.map((r, i) => ({ type: 'Feature', properties: { i, sel: i === selected ? 1 : 0 }, geometry: r.geometry })),

      stepsEl.replaceChildren(...steps.map((s) => h('li', { onclick: () => map.flyTo({ center: [s.maneuver.lon, s.maneuver.lat], zoom: Math.max(map.getZoom(), 16) }) },
        h('span', {}, instruction(s)),

    }
    function fitRoutes() {

    }

    const verbs = {
      'new name': 'Continue', continue: 'Continue', turn: 'Turn', merge: 'Merge', fork: 'Keep',
      'on ramp': 'Take the ramp', 'off ramp': 'Take the exit', 'end of road': 'At the end of the road, turn',
      roundabout: 'Enter the roundabout', rotary: 'Enter the rotary', 'roundabout turn': 'At the roundabout, turn',
      'exit roundabout': 'Exit the roundabout', 'exit rotary': 'Exit the rotary', notification: 'Continue',

    }

    // ---------------------------------------------------------------- styles
    // GET /v1/styles fills the picker; without a key only "default" is offered.
    let styleList = [];

    function describeStyle() {

    }
    async function loadStyles() {
      if (!apiKey) { describeStyle(); return; }
      try { renderStyles(await api('styles', {}, 'styles')); }
      catch (e) { if (e.name !== 'AbortError' && e.status !== 401) showError(e); }
    }
    styleEl.addEventListener('change', () => {
      const id = styleEl.value;

      } catch (e) {
        if (e.name === 'AbortError') return;

        } else {

    // ----------------------------------------------------------------- trips
    // Geometry on the client: haversine distances, bearings and positions along a path.
    const R = 6371008.8, rad = (d) => d * Math.PI / 180, deg = (r) => r * 180 / Math.PI;
    function distM(a, b) {
      const h = Math.sin(rad(b[1] - a[1]) / 2) ** 2 + Math.cos(rad(a[1])) * Math.cos(rad(b[1])) * Math.sin(rad(b[0] - a[0]) / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(Math.min(1, h)));
    }
    function bearingDeg(a, b) {
      const y = Math.sin(rad(b[0] - a[0])) * Math.cos(rad(b[1]));
      const x = Math.cos(rad(a[1])) * Math.sin(rad(b[1])) - Math.sin(rad(a[1])) * Math.cos(rad(b[1])) * Math.cos(rad(b[0] - a[0]));
      return (deg(Math.atan2(y, x)) + 360) % 360;
    }
    // Encoded polyline (precision 6 for trip routes) to [lon, lat] pairs.
    function decodePolyline(str, precision = 6) {
      const f = 10 ** precision, out = [];
      let i = 0, lat = 0, lon = 0;
      const next = () => {
        let r = 0, sh = 0, b;
        do { b = str.charCodeAt(i++) - 63; r |= (b & 31) << sh; sh += 5; } while (b >= 32);
        return r & 1 ? ~(r >> 1) : r >> 1;
      };
      while (i < str.length) { lat += next(); lon += next(); out.push([lon / f, lat / f]); }
      return out;
    }
    function makePath(coords) {
      const cum = [0];
      for (let i = 1; i < coords.length; i++) cum.push(cum[i - 1] + distM(coords[i - 1], coords[i]));
      return { coords, cum, length: cum[cum.length - 1] };
    }
    // Position and direction `s` metres along a path.
    function along(path, s) {
      const c = path.coords, cum = path.cum;
      if (c.length < 2) return { ll: c[0], brg: 0 };
      s = Math.max(0, Math.min(s, path.length));
      let i = 1;
      while (i < c.length - 1 && cum[i] < s) i++;
      const seg = cum[i] - cum[i - 1], t = seg > 0 ? (s - cum[i - 1]) / seg : 0;
      return { ll: [c[i - 1][0] + (c[i][0] - c[i - 1][0]) * t, c[i - 1][1] + (c[i][1] - c[i - 1][1]) * t], brg: bearingDeg(c[i - 1], c[i]) };
    }
    // Distance along the path of the point nearest to ll (flat projection, fine for a city).
    function project(path, ll) {
      const kx = 111320 * Math.cos(rad(ll[1])), ky = 110540;
      let best = { d: Infinity, s: 0 };
      for (let i = 1; i < path.coords.length; i++) {
        const a = path.coords[i - 1], b = path.coords[i];
        const ax = (a[0] - ll[0]) * kx, ay = (a[1] - ll[1]) * ky, bx = (b[0] - ll[0]) * kx, by = (b[1] - ll[1]) * ky;
        const dx = bx - ax, dy = by - ay, d2 = dx * dx + dy * dy;
        const t = d2 > 0 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / d2)) : 0;
        const d = Math.hypot(ax + t * dx, ay + t * dy);
        if (d < best.d) best = { d, s: path.cum[i - 1] + t * (path.cum[i] - path.cum[i - 1]) };
      }
      return best.s;
    }
    const gauss = () => Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    const tripEl = $('trip'), tripHeadEl = $('tripHead'), tripInfoEl = $('tripInfo'), tripConnEl = $('tripConn');
    const tripStartBtn = $('tripStartBtn'), driveBtn = $('driveBtn'), detourBtn = $('detourBtn'), watchLinkEl = $('watchLink');
    // What is drawn: the trip's current route and the car. Kept here so that a style switch
    // (which drops the layers) can redraw them.
    const tripDraw = { route: null, car: null };
    function drawTripRoute(coords) {
      tripDraw.route = coords;
      const src = map.getSource && map.getSource('trip-route');
      if (src) src.setData({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: coords || [] } });
    }
    function placeCar(ll, brg, watched) {
      if (!tripDraw.car) {
        tripDraw.car = new maplibregl.Marker({ element: h('div', { class: 'car' + (watched ? ' watched' : '') }), rotationAlignment: 'map' });
        tripDraw.car.setLngLat(ll).addTo(map);
      }
      tripDraw.car.setLngLat(ll);

    }
    function fitTrip() {
      const b = new maplibregl.LngLatBounds();

      tripInfoEl.replaceChildren(...[
        ended ? h('div', { class: 'eta' }, info.status === 'arrived' ? 'Arrived' : 'Ended (' + info.status + ')')
          : info.progress ? h('div', { class: 'eta' }, etaText(info.progress)) : null,
        info.progress && info.progress.off_route && !ended ? h('div', { class: 'off' }, 'Off the route: a new one is on its way') : null,

    // Calls /v1/trips/{id}<path> with a trip token.
    async function tripCall(id, path, token, method = 'GET', payload) {

      if (payload !== undefined) headers['Content-Type'] = 'application/json';
      const res = await fetch(new URL('../v1/trips/' + encodeURIComponent(id) + path, location.href),

      const body = await res.json().catch(() => null);
      if (!res.ok) {
        const err = new Error((body && body.error && body.error.message) || res.statusText);
        err.status = res.status;
        err.code = body && body.error && body.error.code;
        throw err;
      }
      return body;
    }

    // ---- the driver: a simulated car
    // Drives the current path at `speed` m/s. Simulated time runs `mult` times faster than real
    // time and starts two hours back, so that its fixes never look like they come from the
    // future (the service rejects fixes > 10 min ahead of its clock).
    const sim = {
      trip: null, version: 1, path: null, s: 0, mode: 'route', // route | detour | self
      running: false, speed: 12, t: 0, seq: 0, buf: [], lastSend: 0, sending: false, ended: false,
      timer: null, picking: false,
    };
    function simSetPath(coords, mode, fromLL) {
      sim.path = makePath(coords);
      sim.mode = mode;
      sim.s = fromLL ? project(sim.path, fromLL) : 0;
    }
    async function startTrip() {
      if (!route.start || !route.end) return;
      const origin = { lon: route.start.ll[0], lat: route.start.ll[1] }, destination = { lon: route.end.ll[0], lat: route.end.ll[1] };
      setStatus('creating the trip…');
      try {
        const t = await api('trips', {}, 'trip', 'POST', { origin, destination });
        setDriving(false); // a previous trip of this tab stops here
        clearAll();
        setRouteMode(false);
        for (const id of ['driveBtn', 'detourBtn', 'finishBtn', 'cancelBtn']) $(id).disabled = false;
        detourBtn.setAttribute('aria-pressed', 'false');
        sim.trip = { id: t.trip.id, driver: t.driver_token, watch: t.watch_token, dest: [destination.lon, destination.lat] };
        Object.assign(sim, { version: t.route.version, running: false, seq: 0, buf: [], ended: false, t: Date.now() - 2 * 3600e3 });
        const coords = decodePolyline(t.route.geometry);
        simSetPath(coords, 'route');
        drawTripRoute(coords);
        placeCar(coords[0], coords.length > 1 ? bearingDeg(coords[0], coords[1]) : 0, false);
        const link = location.origin + location.pathname + '#trip=' + t.trip.id + '&watch=' + t.watch_token;
        watchLinkEl.href = link;
        watchLinkEl.textContent = 'open';
        tripEl.hidden = false;
        document.body.classList.add('driving');
        showTrip({ status: 'active', version: t.route.version, progress: { remaining_m: t.route.distance_m, remaining_s: t.route.duration_s },
          note: 'Press Drive. Trip ' + t.trip.id });

        setStatus('trip created');
      } catch (e) { showError(e); }
    }
    tripStartBtn.addEventListener('click', startTrip);

    function setDriving(on) {
      sim.running = on && !sim.ended;
      driveBtn.setAttribute('aria-pressed', String(sim.running));
      driveBtn.textContent = sim.running ? 'Pause' : 'Drive';
      clearInterval(sim.timer);
      if (sim.running) { sim.lastTick = performance.now(); sim.timer = setInterval(simTick, 200); }
    }
    driveBtn.addEventListener('click', () => setDriving(!sim.running));

    // One step of the simulation: one fix per simulated second.
    function simTick() {
      const now = performance.now(), mult = Number($('simMult').value);
      const dtSim = (now - sim.lastTick) / 1000 * mult;
      sim.lastTick = now;
      sim.acc = (sim.acc || 0) + dtSim;
      while (sim.acc >= 1) {
        sim.acc -= 1;
        sim.t += 1000;
        const atEnd = sim.s >= sim.path.length;
        if (atEnd && sim.mode === 'detour') { driveOnFromDetour(); }
        const moving = !atEnd;
        if (moving) sim.s = Math.min(sim.path.length, sim.s + sim.speed);
        const p = along(sim.path, sim.s);
        placeCar(p.ll, p.brg, false);
        const noise = $('simNoise').checked ? 4 : 0;
        const ll = noise ? [p.ll[0] + gauss() * noise / (111320 * Math.cos(rad(p.ll[1]))), p.ll[1] + gauss() * noise / 110540] : p.ll;
        sim.buf.push({ seq: ++sim.seq, ts: new Date(sim.t).toISOString(), lat: +ll[1].toFixed(7), lon: +ll[0].toFixed(7),
          accuracy: noise ? 8 : 5, speed: moving ? sim.speed : 0, heading: +p.brg.toFixed(1) });

    // After a detour the car heads for the destination by a route of its own choosing (the

    let detourBusy = false;
    async function driveOnFromDetour() {

          points: from.map((v) => v.toFixed(6)).join(',') + ';' + sim.trip.dest.map((v) => v.toFixed(6)).join(',') }, 'simRoute');

      } catch (e) { showError(e); } finally { detourBusy = false; }
    }

    async function sendBatch() {

        const r = await tripCall(sim.trip.id, '/positions', sim.trip.driver, 'POST', { known_route_version: sim.version, positions: batch });
        if (r.route && r.route.version !== sim.version) {

          sim.version = r.route.version;
          const coords = decodePolyline(r.route.geometry);
          simSetPath(coords, 'route', along(sim.path, sim.s).ll);
          drawTripRoute(coords);

          note: 'seq ' + r.last_seq + (r.route ? ' · new route: ' + r.route.reason : '') });

    detourBtn.addEventListener('click', () => {

    // ---- the watcher: the event stream, read with fetch (EventSource cannot send Authorization)
    const watch = { last: null, ctl: null, prev: 0, anim: 0 };
    function animateCar(points, fallback) {
      // Plays the batch's points over the time since the previous batch (capped), so the car
      // moves smoothly instead of jumping every few seconds.
      cancelAnimationFrame(watch.anim);
      const now = performance.now();
      const dur = Math.min(Math.max(watch.prev ? now - watch.prev : 1000, 300), 6000);
      watch.prev = now;
      const pts = points.length ? points.map((p) => [p.lon, p.lat]) : [fallback];
      const start = tripDraw.car ? [tripDraw.car.getLngLat().lng, tripDraw.car.getLngLat().lat] : pts[0];
      const path = makePath([start, ...pts]);
      const t0 = performance.now();
      const step = () => {
        const k = Math.min(1, (performance.now() - t0) / dur);

        placeCar(p.ll, path.length > 1 ? p.brg : null, true);

    async function follow() {
      document.body.classList.add('watch-mode');
      tripEl.hidden = false;
      for (const e of document.querySelectorAll('.driver-only')) e.hidden = true;
      for (const e of document.querySelectorAll('.watcher-only')) e.hidden = false;
      tripHeadEl.textContent = 'Trip';
      let retry = 3000;
      for (;;) {
        watch.ctl = new AbortController();
        const headers = { Authorization: 'Bearer ' + watchTarget.token, Accept: 'text/event-stream' };
        if (watch.last !== null) headers['Last-Event-ID'] = String(watch.last);
        tripConnEl.textContent = ' · connecting…';
        let res;
        try {
          res = await fetch(new URL('../v1/trips/' + encodeURIComponent(watchTarget.id) + '/events', location.href), { headers, signal: watch.ctl.signal });
        } catch (e) {

    $('unwatchBtn').addEventListener('click', () => {

    });

    // ------------------------------------------------------------ map events
    map.on('click', (e) => {
      // Clicks on markers (pick pin, route points) are handled by the markers themselves.
      if (e.originalEvent.target.closest('.maplibregl-marker')) return;
      hideResults();
      if (sim.picking) { startDetour(e.lngLat); return; }
      if (document.body.classList.contains('watch-mode')) return;
      if (routeMode) {
        const r = 6;
        const hit = map.getLayer('route-line') && map.queryRenderedFeatures(
          [[e.point.x - r, e.point.y - r], [e.point.x + r, e.point.y + r]], { layers: ['route-line'] })
          .find((f) => f.properties.i !== selected);
        if (hit) selectRoute(hit.properties.i);
        else { clearPick(); addWaypoint(e.lngLat); }
      } else {
        lookupPoint(e.lngLat);
      }
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.activeElement !== qEl) hideResults(); });

    // Labels use coalesce(name:<lang>, name:latin); switching the language rewrites that expression.
    const isNameLayer = (l) => l.layout && Array.isArray(l.layout['text-field']) &&
      JSON.stringify(l.layout['text-field']).includes('name:latin');
    function setLanguage(lang) {
      for (const l of map.getStyle().layers) {
        if (isNameLayer(l)) {
          map.setLayoutProperty(l.id, 'text-field', ['coalesce', ['get', 'name:' + lang], ['get', 'name:latin']]);
        }
      }
    }

    map.once('load', () => {
      const langs = (map.getStyle().metadata || {})['map-service:languages'] || ['ru'];
      for (const l of langs) langEl.add(new Option(l, l));
      langEl.addEventListener('change', () => setLanguage(langEl.value));
      loadStyles();
    });
    // Runs for the first style and after every switch: setStyle drops the route
    // layers and the chosen label language, so both are restored here.
    map.on('style.load', () => {
      if (langEl.value) setLanguage(langEl.value);
      map.addSource('routes', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addLayer({ id: 'route-casing', type: 'line', source: 'routes',
        layout: { 'line-join': 'round', 'line-cap': 'round', 'line-sort-key': ['get', 'sel'] },
        paint: { 'line-color': '#fff', 'line-width': 9, 'line-opacity': 0.9 } });
      map.addLayer({ id: 'route-line', type: 'line', source: 'routes',
        layout: { 'line-join': 'round', 'line-cap': 'round', 'line-sort-key': ['get', 'sel'] },
        paint: { 'line-color': ['case', ['==', ['get', 'sel'], 1], '#1a73e8', '#9aa0a6'], 'line-width': 5 } });
      renderRoutes(routes, '', true);
      map.addSource('trip-route', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addLayer({ id: 'trip-route-casing', type: 'line', source: 'trip-route',
        layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#fff', 'line-width': 9, 'line-opacity': 0.9 } });
      map.addLayer({ id: 'trip-route-line', type: 'line', source: 'trip-route',
        layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#0b8043', 'line-width': 5 } });
      if (tripDraw.route) drawTripRoute(tripDraw.route);
      setStatus('ok');
    });
    map.on('error', (e) => {
      setStatus('error: ' + ((e.error && e.error.message) || 'see console'), true);
      console.error(e.error || e);
    });
    updateHint();
    if (watchTarget) follow();
  </script>
</body>
</html>
