<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>map-service API</title>
  <!-- Swagger UI over this service's own /openapi.yaml. Swagger UI is vendored
       (deploy/tiles/vendor): no third-party hosts are contacted.
       Served at /docs. Click "Authorize" and enter an API key to call /v1/*. -->
  <link rel="stylesheet" href="docs/swagger-ui.css">
  <style>
    body { margin: 0; }
    .swagger-ui .scheme-container { box-shadow: none; border-bottom: 1px solid #e5e5e5; }
  </style>
</head>
<body>
  <div id="ui"></div>
  <script src="docs/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: new URL('openapi.yaml', location.href).href,
      dom_id: '#ui',
      deepLinking: true,
      displayRequestDuration: true,
      tryItOutEnabled: true,
      presets: [SwaggerUIBundle.presets.apis],
    });
  </script>
</body>
</html>
