openapi: 3.1.0
info:
  title: map-service API
  version: 1.0.0
  summary: Geocoding, autocomplete, routing, vector tiles and live trip tracking for a single city.
  description: |
    Self-hosted map API built on OpenStreetMap data (Nominatim, Photon, OSRM,
    PMTiles). Responses use the service's own JSON format; raw upstream
    responses are never returned.

    **Scope.** The service covers one city. Results outside the configured
    bounding box (`CITY_BBOX`) are dropped, and route points outside it are
    rejected with `400 invalid_argument`.

    **Authentication.** `/v1/*` requires an API key in the `X-API-Key` header.
    `/healthz` and `/tiles/*` are public unless `AUTH_REQUIRE_FOR_TILES=true`.
    `PUT /v1/styles/default` needs an admin key (`ADMIN_API_KEYS`); admin keys
    are accepted wherever an API key is.

    **Trips.** A driver's app creates a trip (`POST /v1/trips`, API key) and
    gets the route plus two tokens: `drv_…` for itself and `wch_…` to hand to
    one watcher. The app sends GPS positions in batches; the service follows
    the car along the route, builds a new route when the car leaves it and
    ends the trip on arrival. The watcher reads the trip
    (`GET /v1/trips/{id}`) and follows it live over Server-Sent Events
    (`/v1/trips/{id}/events`). Every `/v1/trips/{id}…` call takes a trip
    token as `Authorization: Bearer`, never the API key. Trips are served by
    the separate `trips` service behind the same address.

    **Map styles.** Several MapLibre styles are installed (`GET /v1/styles`);
    `/tiles/style.json` is the default one, which an admin can switch at
    runtime without restarting clients.

    **Rate limiting.** Token bucket per API key and per client IP. When the
    limit is exceeded the service answers `429` with a `Retry-After` header.

    **Errors.** Every error has the same shape: `{"error":{"code","message"}}`.

    Data © OpenStreetMap contributors (ODbL). Tile schema © OpenMapTiles
    (CC-BY 4.0); every style carries the attribution its design requires.
  license:
    name: ODbL data; code licence is the repository's
    url: https://www.openstreetmap.org/copyright
servers:
  - url: http://localhost:8080
    description: Local development (dev compose overlay)
  - url: https://maps.example.com
    description: Production behind Caddy
tags:
  - name: search
    description: Geocoding and address autocomplete
  - name: routing
    description: Route planning
  - name: styles
    description: Map style catalogue and the default style
  - name: tiles
    description: Vector tiles and map style resources
  - name: trips
    description: Trip tracking - a car followed along its route, rerouting, a live view for one watcher
  - name: ops
    description: Health probes
security:
  - ApiKeyAuth: []

paths:
  /v1/autocomplete:
    get:
      tags: [search]
      operationId: autocomplete
      summary: Address suggestions while the user types
      description: |
        Served by Photon. If Photon fails or returns nothing, the gateway falls
        back to Nominatim `/search`; the `source` field of every place tells
        which backend produced it.
      parameters:
        - $ref: "#/components/parameters/Query"
        - name: lat
          in: query
          description: Latitude of the user; biases results to be near it. Must be given together with `lon`.
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lon
          in: query
          description: Longitude of the user (see `lat`).
          schema: { type: number, minimum: -180, maximum: 180 }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Lang"
      responses:
        "200": { $ref: "#/components/responses/Places" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "429": { $ref: "#/components/responses/Error429" }
        "502": { $ref: "#/components/responses/Error502" }
        "504": { $ref: "#/components/responses/Error504" }

  /v1/geocode:
    get:
      tags: [search]
      operationId: geocode
      summary: Find an address or a place by text
      description: Served by Nominatim `/search`, restricted to the city bounding box.
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Lang"
      responses:
        "200": { $ref: "#/components/responses/Places" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "429": { $ref: "#/components/responses/Error429" }
        "502": { $ref: "#/components/responses/Error502" }
        "504": { $ref: "#/components/responses/Error504" }

  /v1/reverse:
    get:
      tags: [search]
      operationId: reverse
      summary: Address of a coordinate
      description: Served by Nominatim `/reverse`. Answers `404 not_found` when nothing is known at the point.
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
          example: 51.1283
        - name: lon
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
          example: 71.4306
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: The place at the coordinate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Place" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "404": { $ref: "#/components/responses/Error404" }
        "429": { $ref: "#/components/responses/Error429" }
        "502": { $ref: "#/components/responses/Error502" }
        "504": { $ref: "#/components/responses/Error504" }

  /v1/route:
    get:
      tags: [routing]
      operationId: route
      summary: Build a route through two or more points
      description: Served by the OSRM instance of the requested profile.
      parameters:
        - name: profile
          in: query
          required: true
          description: Routing profile; must be one of `ROUTING_PROFILES` (default `car`, `foot`).
          schema: { type: string, examples: [car] }
        - name: points
          in: query
          required: true
          description: |
            Semicolon-separated `lon,lat` pairs, at least two. Every point must
            lie inside the city bounding box.
          schema: { type: string }
          example: "71.4306,51.1283;71.4700,51.1800"
        - name: alternatives
          in: query
          description: Also return alternative routes (only meaningful for two points).
          schema: { type: boolean, default: false }
        - name: steps
          in: query
          description: Include turn-by-turn `steps` in every leg.
          schema: { type: boolean, default: false }
        - name: geometry
          in: query
          description: |
            Geometry encoding: `polyline` (precision 5), `polyline6`
            (precision 6) or `geojson` (a GeoJSON LineString).
          schema: { type: string, enum: [polyline, polyline6, geojson], default: polyline }
      responses:
        "200":
          description: One or more routes, best first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteResponse" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "404": { $ref: "#/components/responses/Error404" }
        "429": { $ref: "#/components/responses/Error429" }
        "502": { $ref: "#/components/responses/Error502" }
        "504": { $ref: "#/components/responses/Error504" }

  /v1/styles:
    get:
      tags: [styles]
      operationId: listStyles
      summary: List the installed map styles
      description: |
        Every style is a MapLibre style JSON served at its `url`
        (`/tiles/styles/{id}.json`). `default` is the one `/tiles/style.json`
        serves.
      responses:
        "200":
          description: The catalogue, sorted by id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StylesResponse" }
        "401": { $ref: "#/components/responses/Error401" }
        "429": { $ref: "#/components/responses/Error429" }

  /v1/styles/default:
    put:
      tags: [styles]
      operationId: setDefaultStyle
      summary: Make a style the default (admin)
      description: |
        `/tiles/style.json` serves the chosen style to every client from now
        on; it is sent with `Cache-Control: no-cache`, so map clients pick the
        change up on their next style load. The choice is persisted
        (`STATE_DIR`) and survives restarts; until a choice is made
        `DEFAULT_STYLE` applies. Requires a key from `ADMIN_API_KEYS`; with
        none configured the endpoint answers `403`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              additionalProperties: false
              properties:
                id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,47}$", example: warm }
      responses:
        "200":
          description: The catalogue after the switch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StylesResponse" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403":
          description: Switching is disabled (`forbidden`, no `ADMIN_API_KEYS`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: forbidden, message: "switching the default style is disabled: set ADMIN_API_KEYS" } }
        "429": { $ref: "#/components/responses/Error429" }

  /v1/trips:
    post:
      tags: [trips]
      operationId: createTrip
      summary: Create a trip (driver's app)
      description: |
        Builds the first car route from `origin` to `destination` (both inside
        the city) and returns it with the trip's two tokens. **The tokens are
        shown only here**: the service stores nothing but their SHA-256. Keep
        `driver_token` in the app; give `watch_token` to the watcher (as a
        link, for instance). `heading` makes a car that is already moving get
        a route that starts in its direction of travel.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTripRequest" }
      responses:
        "201":
          description: The new trip.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateTripResponse" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "404": { $ref: "#/components/responses/Error404" }
        "429": { $ref: "#/components/responses/Error429" }
        "502": { $ref: "#/components/responses/Error502" }
        "504": { $ref: "#/components/responses/Error504" }

  /v1/trips/{id}:
    get:
      tags: [trips]
      operationId: getTrip
      summary: The trip as it is now (driver or watcher)
      description: |
        Status, current route, last accepted position and progress, and
        `last_event_id`: the event stream continues after it.
      security: [{ TripToken: [] }]
      parameters: [{ $ref: "#/components/parameters/TripID" }]
      responses:
        "200":
          description: The trip.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripSnapshot" }
        "401": { $ref: "#/components/responses/TripError401" }
        "403": { $ref: "#/components/responses/TripError403" }
        "404": { $ref: "#/components/responses/TripError404" }
        "429": { $ref: "#/components/responses/Error429" }

  /v1/trips/{id}/positions:
    post:
      tags: [trips]
      operationId: sendPositions
      summary: Report GPS positions (driver)
      description: |
        A batch of fixes, oldest first, at most `TRIPS_MAX_BATCH` (100). Send
        one every 3-5 s while driving, the app in the background included;
        without network keep collecting and send the backlog in order, in
        chunks of at most 100. `seq` numbers the fixes of the whole trip from
        1; a batch sent again (no answer received) is harmless, fixes whose
        `seq` was already seen are ignored.

        The service follows the car along its route. When the car has left
        the route (several fixes, seconds and metres away from it, confirmed
        by map matching where parallel roads make distance ambiguous) it
        builds a new route from the car's position and heading to the
        destination: `route_version` grows and, because it differs from
        `known_route_version`, the answer carries the new `route`. When the
        car stops within ~40 m of the destination the trip ends with status
        `arrived`; later batches get `409 trip_ended`.

        Fixes whose device clock is more than 10 min ahead or 24 h behind the
        server are stored as rejected (`bad_time`) and otherwise ignored.
      security: [{ TripToken: [] }]
      parameters: [{ $ref: "#/components/parameters/TripID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PositionsRequest" }
      responses:
        "200":
          description: What the batch changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PositionsResponse" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/TripError401" }
        "403": { $ref: "#/components/responses/TripError403" }
        "404": { $ref: "#/components/responses/TripError404" }
        "409": { $ref: "#/components/responses/TripError409" }
        "429": { $ref: "#/components/responses/Error429" }

  /v1/trips/{id}/events:
    get:
      tags: [trips]
      operationId: tripEvents
      summary: Follow the trip live (Server-Sent Events, driver or watcher)
      description: |
        A `text/event-stream`. Every event has an `id`, an `event` type and a
        JSON `data` line:

        | event | data | when |
        |---|---|---|
        | `snapshot` | `TripSnapshot` | first, unless resuming; its id is the trip's latest event |
        | `position` | `PositionEvent` | a batch with accepted fixes arrived (`points` lets the map animate the car between them) |
        | `route` | `TripRoute` | the trip got a new route |
        | `status` | `TripStatusEvent` | the trip ended; the stream closes |

        Without `Last-Event-ID` the stream starts with a snapshot. With it
        (EventSource sends it when it reconnects; `last_event_id` does the same
        as a query parameter) the missed events come first; if more than 200
        were missed, a fresh snapshot replaces them. Reconnecting to an ended
        trip with nothing left to send answers `204`, which makes EventSource
        stop. Quiet streams get a `: ping` comment every 15 s; `retry` is 3 s.
        At most 4 streams per trip.

        Browsers' EventSource cannot send `Authorization`; read the stream
        with `fetch` instead, and keep the token out of URLs (a page can take
        it from its `#fragment`, which is never sent to the server).
      security: [{ TripToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/TripID" }
        - name: Last-Event-ID
          in: header
          description: Resume after this event.
          schema: { type: integer, minimum: 0 }
        - name: last_event_id
          in: query
          description: Same as the `Last-Event-ID` header (the header wins).
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                retry: 3000

                id: 41
                event: snapshot
                data: {"trip":{"id":"01a14369-9f1b-7ba3-87a8-926e582553f9","status":"active",...},"last_event_id":41}

                id: 42
                event: position
                data: {"position":{"seq":251,"ts":"2026-10-16T06:32:44Z","lat":51.1452,"lon":71.4466},"points":[...],"progress":{...},"route_version":1}

                : ping

        "204":
          description: The trip has ended and there is nothing more to send.
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/TripError401" }
        "403": { $ref: "#/components/responses/TripError403" }
        "404": { $ref: "#/components/responses/TripError404" }
        "429": { $ref: "#/components/responses/Error429" }

  /v1/trips/{id}/track:
    get:
      tags: [trips]
      operationId: tripTrack
      summary: The trip's history (driver or watcher)
      description: |
        Every route the trip had and its positions in `seq` order, page by
        page: while `next_after_seq` is present, ask again with `after_seq` set
        to it. Rejected positions are included, with the reason. History is
        kept `TRIPS_RETENTION` (90 days) after the trip ends; the watcher's
        token stops working `TRIPS_WATCH_GRACE` (1 h) after the end.
      security: [{ TripToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/TripID" }
        - name: after_seq
          in: query
          description: Positions with a greater `seq`.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          description: Positions per page.
          schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 }
      responses:
        "200":
          description: One page of the history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackResponse" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/TripError401" }
        "403": { $ref: "#/components/responses/TripError403" }
        "404": { $ref: "#/components/responses/TripError404" }
        "429": { $ref: "#/components/responses/Error429" }

  /v1/trips/{id}/finish:
    post:
      tags: [trips]
      operationId: finishTrip
      summary: End the trip (driver)
      description: |
        The trip ends with status `finished` (the car did not stop close
        enough to the destination to arrive on its own, say). Ending an ended
        trip changes nothing and answers with how it ended, so retrying is
        safe.
      security: [{ TripToken: [] }]
      parameters: [{ $ref: "#/components/parameters/TripID" }]
      responses:
        "200": { $ref: "#/components/responses/TripEnded" }
        "401": { $ref: "#/components/responses/TripError401" }
        "403": { $ref: "#/components/responses/TripError403" }
        "404": { $ref: "#/components/responses/TripError404" }
        "429": { $ref: "#/components/responses/Error429" }

  /v1/trips/{id}/cancel:
    post:
      tags: [trips]
      operationId: cancelTrip
      summary: Cancel the trip (driver)
      description: As `finish`, with status `cancelled`.
      security: [{ TripToken: [] }]
      parameters: [{ $ref: "#/components/parameters/TripID" }]
      responses:
        "200": { $ref: "#/components/responses/TripEnded" }
        "401": { $ref: "#/components/responses/TripError401" }
        "403": { $ref: "#/components/responses/TripError403" }
        "404": { $ref: "#/components/responses/TripError404" }
        "429": { $ref: "#/components/responses/Error429" }

  /tiles/{z}/{x}/{y}.mvt:
    get:
      tags: [tiles]
      operationId: getTile
      summary: Vector tile (Mapbox Vector Tile, OpenMapTiles schema)
      description: |
        Gzip-compressed MVT. `204` means the tile exists in the grid but holds
        no data. The response carries `ETag` and `Cache-Control`; send
        `If-None-Match` to get `304`.
      security: [{}, { ApiKeyAuth: [] }]
      parameters:
        - { name: z, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 14 } }
        - { name: x, in: path, required: true, schema: { type: integer, minimum: 0 } }
        - { name: y, in: path, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: The tile.
          headers:
            Content-Encoding: { schema: { type: string, enum: [gzip] } }
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string, example: "public, max-age=3600" } }
          content:
            application/vnd.mapbox-vector-tile:
              schema: { type: string, format: binary }
        "204": { description: Empty tile. }
        "304": { description: Not modified. }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "429": { $ref: "#/components/responses/Error429" }

  /tiles/style.json:
    get:
      tags: [tiles, styles]
      operationId: getStyle
      summary: The default MapLibre style
      description: |
        The style chosen with `PUT /v1/styles/default` (else `DEFAULT_STYLE`,
        `liberty` out of the box). It can change at runtime, so it is sent
        with `Cache-Control: no-cache` and an `ETag` (revalidation is a cheap
        `304`). Tile, glyph and sprite URLs point back to this service
        (`PUBLIC_BASE_URL`); `metadata["map-service:style-id"]` names the style.
      security: [{}, { ApiKeyAuth: [] }]
      responses:
        "200":
          description: Style JSON v8.
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string, example: no-cache } }
          content:
            application/json:
              schema: { type: object }
        "304": { description: Not modified. }
        "401": { $ref: "#/components/responses/Error401" }
        "404": { $ref: "#/components/responses/Error404" }

  /tiles/styles/{id}.json:
    get:
      tags: [tiles, styles]
      operationId: getStyleById
      summary: One installed MapLibre style
      description: |
        Installed: `liberty` (OSM Liberty), `positron` (light), `dark-matter`
        (dark), `warm` (warm cream palette, orange arterials). See `GET /v1/styles`.
      security: [{}, { ApiKeyAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,47}$", example: positron } }
      responses:
        "200":
          description: Style JSON v8.
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string, example: no-cache } }
          content:
            application/json:
              schema: { type: object }
        "304": { description: Not modified. }
        "401": { $ref: "#/components/responses/Error401" }
        "404": { $ref: "#/components/responses/Error404" }

  /tiles/fonts/{fontstack}/{range}.pbf:
    get:
      tags: [tiles]
      operationId: getGlyphs
      summary: Glyph range (protobuf) for a font stack
      security: [{}, { ApiKeyAuth: [] }]
      parameters:
        - { name: fontstack, in: path, required: true, schema: { type: string, example: Noto Sans Regular } }
        - { name: range, in: path, required: true, schema: { type: string, pattern: "^[0-9]+-[0-9]+$", example: 0-255 } }
      responses:
        "200":
          description: Glyph PBF.
          content:
            application/x-protobuf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error401" }
        "404": { $ref: "#/components/responses/Error404" }

  /tiles/sprites/{name}:
    get:
      tags: [tiles]
      operationId: getSprite
      summary: Sprite sheet of a style (`<name>.json`, `<name>.png`, `<name>@2x.json`, `<name>@2x.png`; names `osm-liberty`, `positron`, `dark-matter`)
      security: [{}, { ApiKeyAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, example: osm-liberty@2x.png } }
      responses:
        "200":
          description: Sprite image or index.
          content:
            image/png: { schema: { type: string, format: binary } }
            application/json: { schema: { type: object } }
        "401": { $ref: "#/components/responses/Error401" }
        "404": { $ref: "#/components/responses/Error404" }

  /tiles/preview.html:
    get:
      tags: [tiles]
      operationId: getPreview
      summary: MapLibre page that displays the map and tries the API (style picker, search, routing)
      security: [{}, { ApiKeyAuth: [] }]
      responses:
        "200":
          description: HTML page.
          content:
            text/html: { schema: { type: string } }

  /tiles/vendor/{file}:
    get:
      tags: [tiles]
      operationId: getVendorFile
      summary: MapLibre GL JS files used by the preview page (`maplibre-gl.js`, `maplibre-gl.css`)
      security: [{}, { ApiKeyAuth: [] }]
      parameters:
        - { name: file, in: path, required: true, schema: { type: string, enum: [maplibre-gl.js, maplibre-gl.css] } }
      responses:
        "200":
          description: The file.
          content:
            text/javascript: { schema: { type: string } }
            text/css: { schema: { type: string } }
        "404": { $ref: "#/components/responses/Error404" }

  /docs:
    get:
      tags: [ops]
      operationId: getDocs
      summary: Interactive API documentation (Swagger UI)
      description: |
        Swagger UI over `/openapi.yaml`. Public; click **Authorize** and enter an
        API key to call `/v1/*` from the page.
      security: []
      responses:
        "200":
          description: The HTML page.
          content:
            text/html: { schema: { type: string } }

  /docs/{file}:
    get:
      tags: [ops]
      operationId: getDocsFile
      summary: Swagger UI files used by `/docs` (`swagger-ui-bundle.js`, `swagger-ui.css`)
      security: []
      parameters:
        - { name: file, in: path, required: true, schema: { type: string, enum: [swagger-ui-bundle.js, swagger-ui.css] } }
      responses:
        "200":
          description: The file.
          content:
            text/javascript: { schema: { type: string } }
            text/css: { schema: { type: string } }
        "404": { $ref: "#/components/responses/Error404" }

  /openapi.yaml:
    get:
      tags: [ops]
      operationId: getOpenAPI
      summary: This specification
      description: |
        The OpenAPI document the gateway was built with. `servers` is replaced by
        the address the request came in on (`PUBLIC_BASE_URL` when set).
      security: []
      responses:
        "200":
          description: The specification.
          content:
            application/yaml: { schema: { type: string } }

  /healthz:
    get:
      tags: [ops]
      operationId: healthz
      summary: Liveness probe
      description: Always `200` while the process runs; checks no dependency.
      security: []
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  /readyz:
    get:
      tags: [ops]
      operationId: readyz
      summary: Readiness probe
      description: |
        Checks every upstream (Photon, Nominatim, one OSRM per profile) and the
        local tile archive. Redis is reported but never makes the service
        unready (the gateway runs without cache).
      security: []
      responses:
        "200":
          description: All required upstreams are ok.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: At least one required upstream is down.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    TripToken:
      type: http
      scheme: bearer
      description: |
        A trip's own token from `POST /v1/trips`: `drv_…` (the driver: may
        also send positions and end the trip) or `wch_…` (the watcher: reads
        only).

  parameters:
    TripID:
      name: id
      in: path
      required: true
      description: Trip id (UUID) from `POST /v1/trips`.
      schema: { type: string, format: uuid }
      example: 01a14369-9f1b-7ba3-87a8-926e582553f9
    Query:
      name: q
      in: query
      required: true
      description: Free-text query, 1 to 200 characters.
      schema: { type: string, minLength: 1, maxLength: 200 }
      example: Байтерек
    Limit:
      name: limit
      in: query
      description: Maximum number of results (1 to `MAX_RESULTS_LIMIT`, default 5).
      schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
    Lang:
      name: lang
      in: query
      description: Preferred language of names; one of `LANGUAGES` (default `ru,kk,en`, the first is the default).
      schema: { type: string, examples: [ru] }

  responses:
    TripError401:
      description: Missing or invalid trip token (`unauthorized`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: unauthorized, message: "missing or invalid trip token (Authorization: Bearer drv_... or wch_...)" } }
    TripError403:
      description: |
        The watcher's token may only read (`forbidden`), and only until
        `TRIPS_WATCH_GRACE` (1 h) after the trip has ended; the driver's token
        reads the trip until it is deleted.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            readOnly: { value: { error: { code: forbidden, message: "the watcher token may not do this" } } }
            expired: { value: { error: { code: forbidden, message: "the trip has ended and its watch token has expired" } } }
    TripError404:
      description: No such trip (`not_found`); also a trip deleted after `TRIPS_RETENTION`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: not_found, message: "no such trip" } }
    TripError409:
      description: The trip has ended (`trip_ended`); stop sending positions.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: trip_ended, message: "the trip has ended (arrived)" } }
    TripEnded:
      description: How the trip ended.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TripEnd" }
    Places:
      description: Matching places, best first. May be empty.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlacesResponse" }
    Error400:
      description: Validation error (`invalid_argument`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: invalid_argument, message: "lat: must be between -90 and 90" } }
    Error401:
      description: Missing or invalid API key (`unauthorized`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: unauthorized, message: "missing or invalid API key" } }
    Error404:
      description: Nothing found (`not_found`, `no_route`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: no_route, message: "no route between the given points" } }
    Error429:
      description: Rate limit exceeded (`rate_limited`).
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: rate_limited, message: "rate limit exceeded" } }
    Error502:
      description: An upstream is unavailable or returned garbage (`upstream_unavailable`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: upstream_unavailable, message: "routing service is unavailable" } }
    Error504:
      description: An upstream did not answer in time (`upstream_timeout`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: upstream_timeout, message: "routing service timed out" } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_argument
                - unauthorized
                - forbidden
                - not_found
                - no_route
                - method_not_allowed
                - rate_limited
                - upstream_unavailable
                - upstream_timeout
                - trip_ended
                - internal
            message: { type: string }

    Address:
      type: object
      description: Structured address. Unknown parts are empty strings.
      required: [street, house_number, district, city, postcode]
      properties:
        street: { type: string, example: проспект Тәуелсіздік }
        house_number: { type: string, example: "14" }
        district: { type: string, example: Есиль район }
        city: { type: string, example: Астана }
        postcode: { type: string, example: "010000" }

    Place:
      type: object
      required: [id, name, address, lat, lon, type, source]
      properties:
        id:
          type: string
          description: Stable OSM identifier `<node|way|relation>/<osm id>`; `nominatim/<place_id>` when OSM data is missing.
          example: node/1234567890
        name: { type: string, description: "Name of the place; for plain addresses the street and number.", example: Бәйтерек }
        address: { $ref: "#/components/schemas/Address" }
        lat: { type: number, example: 51.1283 }
        lon: { type: number, example: 71.4306 }
        type: { type: string, description: "OSM value of the main tag (house, residential, cafe, ...).", example: tower }
        source: { type: string, enum: [photon, nominatim] }

    PlacesResponse:
      type: object
      required: [places]
      properties:
        places:
          type: array
          items: { $ref: "#/components/schemas/Place" }

    GeoJSONLineString:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [LineString] }
        coordinates:
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number }
            description: "[lon, lat]"

    Geometry:
      description: |
        Encoded polyline string (`geometry=polyline|polyline6`) or a GeoJSON
        LineString (`geometry=geojson`).
      oneOf:
        - type: string
        - $ref: "#/components/schemas/GeoJSONLineString"

    Maneuver:
      type: object
      required: [type, lat, lon]
      properties:
        type: { type: string, description: "OSRM maneuver type (turn, depart, arrive, ...).", example: turn }
        modifier: { type: string, description: "Direction (left, right, straight, ...).", example: left }
        lat: { type: number }
        lon: { type: number }

    Step:
      type: object
      required: [distance_m, duration_s, name, maneuver, geometry]
      properties:
        distance_m: { type: number }
        duration_s: { type: number }
        name: { type: string, description: Street name, may be empty. }
        maneuver: { $ref: "#/components/schemas/Maneuver" }
        geometry: { $ref: "#/components/schemas/Geometry" }

    Leg:
      type: object
      required: [distance_m, duration_s]
      properties:
        distance_m: { type: number }
        duration_s: { type: number }
        summary: { type: string }
        steps:
          type: array
          description: Present only when `steps=true`.
          items: { $ref: "#/components/schemas/Step" }

    Route:
      type: object
      required: [distance_m, duration_s, geometry, legs]
      properties:
        distance_m: { type: number, example: 8421.7 }
        duration_s: { type: number, example: 812.3 }
        geometry: { $ref: "#/components/schemas/Geometry" }
        legs:
          type: array
          items: { $ref: "#/components/schemas/Leg" }

    Waypoint:
      type: object
      required: [name, lat, lon]
      description: A requested point snapped onto the road network.
      properties:
        name: { type: string }
        lat: { type: number }
        lon: { type: number }

    RouteResponse:
      type: object
      required: [routes, waypoints]
      properties:
        routes:
          type: array
          items: { $ref: "#/components/schemas/Route" }
        waypoints:
          type: array
          items: { $ref: "#/components/schemas/Waypoint" }

    StyleInfo:
      type: object
      required: [id, name, description, url, default]
      properties:
        id: { type: string, example: warm }
        name: { type: string, example: Warm }
        description: { type: string }
        url: { type: string, format: uri, example: "https://maps.example.com/tiles/styles/warm.json" }
        default: { type: boolean, description: "Whether /tiles/style.json serves this style." }

    StylesResponse:
      type: object
      required: [default, styles]
      properties:
        default: { type: string, description: "Id of the default style (empty if none is installed).", example: liberty }
        styles:
          type: array
          items: { $ref: "#/components/schemas/StyleInfo" }

    LatLon:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, example: 51.1283 }
        lon: { type: number, example: 71.4306 }

    TripStatus:
      type: string
      description: "`active`, or how the trip ended: `arrived` (the tracker saw the car arrive), `finished`, `cancelled` (the driver ended it), `expired` (no positions for `TRIPS_IDLE_TIMEOUT`, 30 min)."
      enum: [active, arrived, finished, cancelled, expired]

    CreateTripRequest:
      type: object
      required: [origin, destination]
      properties:
        origin: { $ref: "#/components/schemas/LatLon" }
        destination: { $ref: "#/components/schemas/LatLon" }
        heading:
          type: number
          minimum: 0
          exclusiveMaximum: 360
          description: Direction the car is already moving in at the origin, degrees clockwise from north.

    Trip:
      type: object
      required: [id, status, origin, destination, created_at]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/TripStatus" }
        origin: { $ref: "#/components/schemas/LatLon" }
        destination: { $ref: "#/components/schemas/LatLon" }
        created_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, description: Present once the trip has ended. }

    TripRoute:
      type: object
      required: [version, reason, distance_m, duration_s, geometry, created_at]
      properties:
        version: { type: integer, minimum: 1, description: "1 is the first route; every new route adds one." }
        reason: { type: string, enum: [initial, off_route, wrong_way], description: "Why it was built: the trip started, the car took another road, or it drove against the route." }
        distance_m: { type: number, example: 9044.8 }
        duration_s: { type: number, example: 750.2 }
        geometry:
          type: string
          description: Encoded polyline with precision 6 (OSRM's `polyline6`; decode with a factor of 1e6), from the car's position to the destination.
        created_at: { type: string, format: date-time }

    CreateTripResponse:
      type: object
      required: [trip, driver_token, watch_token, route]
      properties:
        trip: { $ref: "#/components/schemas/Trip" }
        driver_token: { type: string, pattern: "^drv_[A-Za-z0-9_-]{43}$", description: For the driver's app. Shown only once. }
        watch_token: { type: string, pattern: "^wch_[A-Za-z0-9_-]{43}$", description: For the watcher. Shown only once. }
        route: { $ref: "#/components/schemas/TripRoute" }

    PositionInput:
      type: object
      required: [seq, ts, lat, lon]
      properties:
        seq: { type: integer, minimum: 1, description: "Numbers the fixes of the trip from 1, increasing." }
        ts: { type: string, format: date-time, description: When the device took the fix (RFC 3339). }
        lat: { type: number }
        lon: { type: number }
        accuracy: { type: number, description: Horizontal accuracy in metres; fixes worse than 50 m are ignored. }
        speed: { type: number, description: m/s. }
        heading: { type: number, description: Degrees clockwise from north. }

    PositionsRequest:
      type: object
      required: [positions]
      properties:
        known_route_version:
          type: integer
          description: The route version the app shows; the answer carries the route when the trip's version differs (send 0 to get it).
        positions:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/PositionInput" }

    Progress:
      type: object
      required: [along_m, remaining_m, remaining_s, off_route]
      properties:
        along_m: { type: number, description: Metres from the start of the current route. }
        remaining_m: { type: number, description: Metres to the destination along the route. }
        remaining_s: { type: number, description: Seconds to the destination (OSRM's speeds, no traffic). }
        off_route: { type: boolean, description: The car has left the route and a new one is on its way. }

    PositionsResponse:
      type: object
      required: [status, route_version, last_seq]
      properties:
        status: { $ref: "#/components/schemas/TripStatus" }
        route_version: { type: integer }
        last_seq: { type: integer, description: Highest `seq` the service has seen. }
        progress: { $ref: "#/components/schemas/Progress" }
        route: { $ref: "#/components/schemas/TripRoute" }

    TripPosition:
      type: object
      required: [seq, ts, lat, lon]
      properties:
        seq: { type: integer }
        ts: { type: string, format: date-time }
        lat: { type: number }
        lon: { type: number }
        accuracy: { type: number }
        speed: { type: number }
        heading: { type: number }

    TripSnapshot:
      type: object
      required: [trip, route, last_event_id]
      properties:
        trip: { $ref: "#/components/schemas/Trip" }
        route: { $ref: "#/components/schemas/TripRoute" }
        position: { $ref: "#/components/schemas/TripPosition" }
        progress: { $ref: "#/components/schemas/Progress" }
        last_event_id: { type: integer, description: "The event stream continues after this id (0: no events yet)." }

    TripPoint:
      type: object
      required: [ts, lat, lon]
      properties:
        ts: { type: string, format: date-time }
        lat: { type: number }
        lon: { type: number }

    PositionEvent:
      type: object
      required: [position, points, progress, route_version]
      properties:
        position: { $ref: "#/components/schemas/TripPosition" }
        points:
          type: array
          description: The batch's accepted fixes, oldest first, to animate the car between them.
          items: { $ref: "#/components/schemas/TripPoint" }
        progress: { $ref: "#/components/schemas/Progress" }
        route_version: { type: integer }

    TripStatusEvent:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/TripStatus" }

    TripEnd:
      type: object
      required: [status, ended_at]
      properties:
        status: { $ref: "#/components/schemas/TripStatus" }
        ended_at: { type: string, format: date-time }

    TrackPosition:
      type: object
      required: [seq, ts, lat, lon, received_at, route_version]
      properties:
        seq: { type: integer }
        ts: { type: string, format: date-time }
        lat: { type: number }
        lon: { type: number }
        accuracy: { type: number }
        speed: { type: number }
        heading: { type: number }
        received_at: { type: string, format: date-time }
        route_version: { type: integer, description: The route it was judged against. }
        class: { type: string, enum: [on, near, off, wrong_way, start], description: "Where it lay: on the route, near it, clearly off, on it against the direction, or before the car reached the route." }
        reject: { type: string, enum: [duplicate, out_of_order, invalid, inaccurate, jump, bad_time], description: Why it was ignored. }

    TrackResponse:
      type: object
      required: [trip, routes, positions]
      properties:
        trip: { $ref: "#/components/schemas/Trip" }
        routes:
          type: array
          items: { $ref: "#/components/schemas/TripRoute" }
        positions:
          type: array
          items: { $ref: "#/components/schemas/TrackPosition" }
        next_after_seq: { type: integer, description: "More positions follow: ask again with after_seq set to this." }

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        data_version: { type: string, example: 20261014T031500Z }
        checks:
          type: object
          description: One entry per dependency (`photon`, `nominatim`, `osrm-car`, `osrm-foot`, `tiles`, `redis`).
          additionalProperties:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [ok, down, disabled] }
              latency_ms: { type: integer }
              error: { type: string }
